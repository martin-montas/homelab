---
- name: Collect network traffic counters
  hosts: traffic_hosts
  gather_facts: true

  vars:
    mode: start
    run_id: overnight
    traffic_sample_interval: 60
    traffic_duration_hours: 8
    remote_dir: "{{ ansible_user_dir }}/traffic-collection"
    remote_script: "{{ remote_dir }}/traffic-collector.sh"
    remote_csv: "{{ remote_dir }}/{{ run_id }}_{{ inventory_hostname }}.csv"
    traffic_interfaces: "{{ [ansible_default_ipv4.interface] }}"

  tasks:
    - name: Create remote collection directory
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: directory
        mode: "0750"
      when: mode == "start"

    - name: Install traffic collector script
      ansible.builtin.copy:
        dest: "{{ remote_script }}"
        mode: "0750"
        content: |
          #!/usr/bin/env bash
          set -u

          OUTPUT="$1"
          INTERVAL="$2"
          DURATION="$3"
          INTERFACES="$4"

          IFS=',' read -r -a IFACES <<< "$INTERFACES"

          echo "timestamp,interface,rx_bytes,tx_bytes" > "$OUTPUT"
          END=$(( $(date +%s) + DURATION ))

          while [ "$(date +%s)" -lt "$END" ]; do
            TIMESTAMP=$(date -Is)

            for IFACE in "${IFACES[@]}"; do
              BASE="/sys/class/net/$IFACE/statistics"

              if [ -r "$BASE/rx_bytes" ] && [ -r "$BASE/tx_bytes" ]; then
                RX=$(cat "$BASE/rx_bytes")
                TX=$(cat "$BASE/tx_bytes")
                printf '%s,%s,%s,%s\n' \
                  "$TIMESTAMP" "$IFACE" "$RX" "$TX" >> "$OUTPUT"
              else
                echo "Interface not found: $IFACE" >&2
              fi
            done

            sleep "$INTERVAL"
          done
      when: mode == "start"

    - name: Start background traffic collection
      ansible.builtin.shell: |
        nohup bash {{ remote_script | quote }} \
          {{ remote_csv | quote }} \
          {{ traffic_sample_interval | int }} \
          {{ (traffic_duration_hours | int * 3600) }} \
          {{ (traffic_interfaces | join(',')) | quote }} \
          </dev/null >/dev/null 2>&1 &
        echo "Collector started with PID $!"
      args:
        executable: /bin/bash
      when: mode == "start"
      register: collector_start

    - name: Report collector startup
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ collector_start.stdout }}"
      when:
        - mode == "start"
        - collector_start is defined

    - name: Create local results directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/traffic-results/{{ run_id }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      become: false
      run_once: true
      when: mode == "collect"

    - name: Download traffic CSV files
      ansible.builtin.fetch:
        src: "{{ remote_csv }}"
        dest: "{{ playbook_dir }}/traffic-results/{{ run_id }}/"
        flat: true
      when: mode == "collect"
