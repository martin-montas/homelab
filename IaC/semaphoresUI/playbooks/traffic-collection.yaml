
---
- name: Capture network traffic on pfSense routers
  hosts: pfsense
  gather_facts: false
  become: false

  vars:
    capture_duration: 28800
    run_id: overnight
    remote_dir: /var/log/traffic-captures

    remote_file: "{{ remote_dir }}/{{ run_id }}_{{ inventory_hostname }}_{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}.pcap"

    capture_pidfile: "{{ remote_file }}.pid"
    capture_log: "{{ remote_file }}.log"
    timer_log: "{{ remote_file }}.timer.log"

  tasks:
    - name: Create capture directory
      ansible.builtin.raw: |
        mkdir -p "{{ remote_dir }}" &&
        chmod 700 "{{ remote_dir }}"

    - name: Start tcpdump capture with PID tracking
      ansible.builtin.raw: |
        /usr/sbin/daemon \
          -p "{{ capture_pidfile }}" \
          -o "{{ capture_log }}" \
          /usr/sbin/tcpdump \
          -ni "{{ capture_interface }}" \
          -s 0 -U \
          -w "{{ remote_file }}"
      changed_when: true

    - name: Schedule automatic capture termination
      ansible.builtin.raw: |
        /usr/sbin/daemon \
          -o "{{ timer_log }}" \
          /bin/sh -c 'sleep {{ capture_duration }}; if [ -s "{{ capture_pidfile }}" ]; then kill -INT "$(cat "{{ capture_pidfile }}")"; fi'
      changed_when: true

    - name: Report capture details
      ansible.builtin.debug:
        msg:
          - "Capture started on {{ inventory_hostname }}"
          - "Interface: {{ capture_interface }}"
          - "Duration: {{ capture_duration }} seconds"
          - "PCAP: {{ remote_file }}"
          - "PID file: {{ capture_pidfile }}"

